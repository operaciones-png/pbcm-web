<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Mensaje recibido · PBCM</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;padding:2rem;
       font-family:'Nunito',-apple-system,system-ui,sans-serif;line-height:1.7;
       background:#F6F8F3;color:#1C3B54;-webkit-font-smoothing:antialiased}
  .box{max-width:520px;text-align:center}
  .logo{width:170px;max-width:70vw;height:auto;margin:0 auto 2rem;display:block}
  .tick{width:64px;height:64px;margin:0 auto 1.4rem;border-radius:50%;
        background:#3C7325;color:#fff;display:grid;place-items:center}
  h1{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.9rem;
     line-height:1.2;color:#0F3350;margin-bottom:.9rem}
  p{color:#4A5A5E;margin-bottom:.5rem}
  p.alt{font-size:.92rem;color:#5E6F73;margin-top:1rem}
  a.btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.8rem;
        padding:.9rem 1.7rem;border-radius:100px;background:#3C7325;color:#fff;
        font-family:'Baloo 2',sans-serif;font-weight:600;text-decoration:none;
        transition:.2s}
  a.btn:hover{background:#2F5C1D}
  a.btn:focus-visible{outline:3px solid #0F3350;outline-offset:3px}
</style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/img/logo-lockup.webp" alt="PBCM · Community Benefit Environment" width="472" height="407" />
    <p class="tick" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </p>
    <h1>¡Gracias! Recibimos tu mensaje</h1>
    <p>Te respondemos lo antes posible al correo que nos dejaste.</p>
    <p class="alt">Thank you, we received your message. · Merci, nous avons reçu votre message.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
