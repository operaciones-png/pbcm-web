# Configuracion de Netlify para pbcmcolombia.com
# El sitio es HTML estatico: no hay nada que compilar, Netlify solo publica
# los archivos del repositorio tal como estan.

# OJO: se publica TODO lo que este versionado en el repositorio, aunque
# ninguna pagina lo enlace. Un archivo en el repo es una URL publica.
# Los documentos que no deben salir van en _fuentes/, que esta en .gitignore.
[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Cabeceras de seguridad (todas las rutas)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Los estilos y el script van dentro del propio index.html (de ahi
    # 'unsafe-inline'). Las tipografias vienen de Google Fonts. Nada mas
    # puede cargarse: bloquea scripts o imagenes inyectados de terceros.
    # OJO: cualquier servicio externo (analitica, pasarela de pago, mapas) hay
    # que anadirlo aqui O NO FUNCIONARA, y fallara en silencio, sin error
    # visible en la pagina. connect-src es el que suele olvidarse: sin el,
    # el script carga pero no puede enviar nada.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://plausible.io; connect-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
# El HTML siempre se revalida: al publicar un cambio de texto se ve al instante.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Las imagenes se guardan 7 dias en el navegador. Si reemplazas una imagen
# conservando el nombre, quien ya visito el sitio puede seguir viendo la vieja
# hasta una semana: para forzar el cambio, sube el archivo con un nombre nuevo
# (p. ej. foto-rio-2.jpg) y actualiza la referencia en index.html.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------------------
# Redirecciones
# ---------------------------------------------------------------------------
# Antes de unificar el sitio en index.html existia template.html.
[[redirects]]
  from = "/template.html"
  to = "/"
  status = 301
  force = true

# Las fotos originales tienen que seguir versionadas: de ellas salen los .webp
# y sin ellas nadie puede regenerar las imagenes. Pero no hay razon para que
# alguien pueda descargarlas: son 3,4 MB de los 4,7 MB del repositorio, la
# pagina no las usa, y estar versionado es lo mismo que tener URL publica.
# Esta regla las deja fuera de alcance sin sacarlas del repositorio.
# OJO: el archivo se sigue subiendo al CDN, solo que la URL responde 404. Para
# algo que de verdad no deba salir del repositorio, va en _fuentes/ (ver arriba).
# El repositorio se publica entero (publish = "."), asi que cada archivo
# versionado es una URL. Estas carpetas son de trabajo interno y no deben
# tener direccion publica: docs/ contiene el plan y la solicitud de contenido,
# que hablan de la relacion con la operadora; tools/ son scripts de build.
# OJO: el archivo se sigue subiendo al CDN, solo que la URL responde 404. Lo
# que de verdad no puede salir del repositorio va en _fuentes/ (ver arriba).
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/img/originales/*"
  to = "/404.html"
  status = 404
  force = true
