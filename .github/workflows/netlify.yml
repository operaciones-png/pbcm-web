name: Publicar en Netlify

# Robot de publicacion: cada cambio que entra a main se publica en Netlify
# (pbcmcolombia.com) sin arrastrar nada a mano. No necesita iniciar sesion
# en GitHub desde el navegador: usa dos "secretos" guardados en el repo
# (Settings > Secrets > Actions, o con `gh secret set`):
#   NETLIFY_AUTH_TOKEN  -> token personal creado en Netlify (User settings > Applications)
#   NETLIFY_SITE_ID     -> Site ID del sitio (Site configuration > General > Site details)
# Mientras falten, el robot avisa y no publica (no rompe nada).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-prod
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Comprobar que los secretos existen
        id: check
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Faltan los secretos NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID. No se publica. Ver el issue #2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar los archivos del sitio (solo lo versionado)
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sitio"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sitio"
          rm -rf "$RUNNER_TEMP/sitio/.github"

      - name: Publicar en Netlify (produccion)
        if: steps.check.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/sitio
        run: |
          npx --yes netlify-cli@17 deploy --prod --dir=. \
            --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GitHub commit ${GITHUB_SHA::7}"
